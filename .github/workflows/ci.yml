name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify operation registry and generated reference
        run: npm run registry:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          # tests/coverage-report.test.ts writes the R01 reports here only after every
          # one of its gates has passed; they are uploaded only if every later step passes.
          TESTRAIL_MCP_REPORT_DIR: ${{ runner.temp }}/coverage-reports
        # Linux also enforces the 99% source-coverage thresholds in vitest.config.ts. The
        # other systems skip a few platform-specific paths, so they run the suite without it.
        run: npm run ${{ matrix.os == 'ubuntu-latest' && 'test:coverage' || 'test' }}

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Test packed installation and executable
        run: npm run test:package

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/coverage-reports
          if-no-files-found: error
