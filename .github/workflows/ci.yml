name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['26']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Fetch locked dependencies and packed-install metadata
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/testrail-npm-cache
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict
          node scripts/prime-package-cache.mjs

      - name: Verify offline with isolated networking and coverage
        if: runner.os == 'Linux'
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/testrail-npm-cache
          TESTRAIL_MCP_REPORT_DIR: ${{ runner.temp }}/coverage-reports
        run: |
          namespace=testrail-mcp-ci
          sudo ip netns add "$namespace"
          trap 'sudo ip netns delete "$namespace"' EXIT
          sudo ip -n "$namespace" link set lo up
          sudo ip -n "$namespace" address add 203.0.113.10/32 dev lo
          sudo ip netns exec "$namespace" sudo -u "$(id -un)" env \
            HOME="$HOME" PATH="$PATH" npm_config_offline=true VITEST_MAX_WORKERS=3 \
            NPM_CONFIG_CACHE="$NPM_CONFIG_CACHE" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_SHA="$GITHUB_SHA" \
            TESTRAIL_MCP_REPORT_DIR="$TESTRAIL_MCP_REPORT_DIR" TESTRAIL_MCP_GUARDED_TEST_ADDRESS=203.0.113.10 \
            bash -e -c '
              npm ci --offline --engine-strict --no-audit --no-fund
              npm run build
              npm run registry:check
              npm run typecheck
              npm run lint
              npm run test:coverage
              npm pack --dry-run --ignore-scripts
              npm run test:package
              bash -n proxmox/ct/testrail-mcp.sh
              bash -n proxmox/install/testrail-mcp-install.sh
            '

      - name: Verify offline with local fixtures
        if: runner.os != 'Linux'
        shell: bash
        env:
          npm_config_offline: 'true'
          NPM_CONFIG_CACHE: ${{ runner.temp }}/testrail-npm-cache
          VITEST_MAX_WORKERS: '3'
          TESTRAIL_MCP_REPORT_DIR: ${{ runner.temp }}/coverage-reports
        run: |
          npm ci --offline --engine-strict --no-audit --no-fund
          npm run check
          npm pack --dry-run --ignore-scripts

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/coverage-reports
          if-no-files-found: error
