name: Publish

# Runs when a GitHub Release is published for a release/<version> tag, as
# @dichovsky/testrail-api-client releases. The read-only verify job checks the release's
# identity before any repository code runs, runs every release gate and archives the
# tested build. The publish job alone can mint an npm credential, through trusted
# publishing (GitHub OIDC, no stored token). It waits in the protected npm-publish
# environment, runs no repository or dependency code, publishes the tested build with
# provenance, and then checks what npm serves. See docs/release.md.
on:
  release:
    types: [published]

# Source read-only by default; only the publish job gets an OIDC token.
permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      already-published: ${{ steps.preflight.outputs.already-published }}
      dist-sha256: ${{ steps.release-artifact.outputs.sha256 }}

    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the current main branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify source provenance before repository code runs
        shell: bash
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != 'release' || "$RELEASE_ACTION" != 'published' ]]; then
            echo 'Expected a published GitHub Release event.' >&2
            exit 1
          fi
          if [[ "$RELEASE_DRAFT" != 'false' || "$RELEASE_PRERELEASE" != 'false' ]]; then
            echo 'Draft and prerelease releases cannot publish to the stable channel.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must use release/<stable-semver>.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || ! "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'GitHub ref or SHA does not identify the release tag.' >&2
            exit 1
          fi
          HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$GITHUB_SHA" != "$HEAD_SHA" || "$GITHUB_SHA" != "$TAG_SHA" ]]; then
            echo 'Release tag, checkout, and GitHub SHA must identify one commit.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release SHA is not reachable from origin/main.' >&2
            exit 1
          fi

      - name: Set up the release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Verify the complete release identity
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-preflight.mjs context

      - name: Require the version's dated changelog section
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > /dev/null

      - name: Build
        run: npm run build

      - name: Verify the operation registry and generated reference
        run: npm run registry:check

      - name: Type-check with TypeScript 7
        run: npm run typecheck

      - name: Type-check TypeScript 6 compatibility
        run: npm run typecheck:ts6

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Smoke-test the packed package
        run: npm run test:package

      # Registry lookup is fail-closed. An immutable duplicate is green only when gitHead
      # and every packed file match this release; a new version must advance `latest` and
      # every published stable version.
      - name: Verify npm publication state
        id: preflight
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-preflight.mjs registry

      - name: Verify the preflight decision
        shell: bash
        env:
          ALREADY_PUBLISHED: ${{ steps.preflight.outputs.already-published }}
        run: |
          set -euo pipefail
          if [[ "$ALREADY_PUBLISHED" != 'true' && "$ALREADY_PUBLISHED" != 'false' ]]; then
            echo 'Release preflight did not produce an explicit publication decision.' >&2
            exit 1
          fi

      - name: Archive the tested build
        id: release-artifact
        if: steps.preflight.outputs.already-published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if find dist -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'Prepared dist contains a non-regular filesystem entry.' >&2
            exit 1
          fi
          tar -cf release-dist.tar -C dist .
          SHA256="$(sha256sum release-dist.tar | cut -d ' ' -f 1)"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Could not calculate the release artifact SHA-256.' >&2
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Keep the tested build for the publish job
        if: steps.preflight.outputs.already-published == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-dist
          path: release-dist.tar
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    name: publish to npm
    needs: verify
    if: needs.verify.outputs.already-published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A protected environment: its required reviewers approve each release, and npm's
    # trusted publisher configuration names it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the current main branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # A static shell gate that runs before setup-node, npm, or any code from the release
      # tag, so an arbitrary tag cannot reach the part of the job that holds OIDC.
      - name: Verify source provenance before repository code runs
        shell: bash
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != 'release' || "$RELEASE_ACTION" != 'published' ]]; then
            echo 'Expected a published GitHub Release event.' >&2
            exit 1
          fi
          if [[ "$RELEASE_DRAFT" != 'false' || "$RELEASE_PRERELEASE" != 'false' ]]; then
            echo 'Draft and prerelease releases cannot publish to the stable channel.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must use release/<stable-semver>.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || ! "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'GitHub ref or SHA does not identify the release tag.' >&2
            exit 1
          fi
          HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$GITHUB_SHA" != "$HEAD_SHA" || "$GITHUB_SHA" != "$TAG_SHA" ]]; then
            echo 'Release tag, checkout, and GitHub SHA must identify one commit.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release SHA is not reachable from origin/main.' >&2
            exit 1
          fi

      # The next step checks the archive's SHA-256 itself, because the download action
      # warns, rather than fails, when its own digest does not match.
      - name: Download the tested build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-dist
          path: .release-artifact/

      - name: Verify the downloaded build
        shell: bash
        env:
          EXPECTED_DIST_SHA256: ${{ needs.verify.outputs.dist-sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DIST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Expected release artifact SHA-256 is missing or invalid.' >&2
            exit 1
          fi
          ACTUAL_DIST_SHA256="$(sha256sum .release-artifact/release-dist.tar | cut -d ' ' -f 1)"
          if [[ "$ACTUAL_DIST_SHA256" != "$EXPECTED_DIST_SHA256" ]]; then
            echo 'Downloaded release artifact SHA-256 does not match verification.' >&2
            exit 1
          fi
          while IFS= read -r ARCHIVE_PATH; do
            NORMALIZED_PATH="${ARCHIVE_PATH#./}"
            if [[ -n "$NORMALIZED_PATH" && ( "$NORMALIZED_PATH" == /* || "$NORMALIZED_PATH" == ../* || "$NORMALIZED_PATH" == */../* ) ]]; then
              echo 'Downloaded release archive contains an unsafe path.' >&2
              exit 1
            fi
          done < <(tar -tf .release-artifact/release-dist.tar)
          mkdir dist
          tar -xf .release-artifact/release-dist.tar -C dist --no-same-owner
          if find dist -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'Downloaded release files contain a non-regular filesystem entry.' >&2
            exit 1
          fi
          test -f dist/cli.js

      - name: Set up the release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Runs from an empty directory with empty npm config files, so the checkout's .npmrc
      # cannot affect OIDC, the network or the channel. Leaving out --tag keeps npm's own
      # last-moment guard against moving `latest` behind a higher published version.
      - name: Re-check the registry and publish with an isolated npm config
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          while IFS= read -r CONFIG_NAME; do
            NORMALIZED_CONFIG_NAME="${CONFIG_NAME^^}"
            case "$NORMALIZED_CONFIG_NAME" in
              NPM_CONFIG_* | NODE_AUTH_TOKEN | NPM_TOKEN | NPM_ID_TOKEN) unset "$CONFIG_NAME" ;;
            esac
          done < <(compgen -e)

          EXPECTED_VERSION="${RELEASE_TAG#release/}"
          PACKAGE_NAME='@dichovsky/testrail-mcp'
          PACKAGE_SPEC="${PACKAGE_NAME}@${EXPECTED_VERSION}"
          ISOLATED_NPM_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/npm-publish.XXXXXX")"
          USER_CONFIG="$ISOLATED_NPM_DIRECTORY/user.npmrc"
          GLOBAL_CONFIG="$ISOLATED_NPM_DIRECTORY/global.npmrc"
          : > "$USER_CONFIG"
          : > "$GLOBAL_CONFIG"

          EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module --eval '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/package.json`, "utf8"));
            const publishConfig = manifest.publishConfig;
            const validPublishConfig =
              publishConfig !== null &&
              typeof publishConfig === "object" &&
              !Array.isArray(publishConfig) &&
              Object.keys(publishConfig).length === 1 &&
              publishConfig.access === "public";
            if (
              manifest.name !== "@dichovsky/testrail-mcp" ||
              manifest.version !== process.env.EXPECTED_VERSION ||
              !validPublishConfig
            ) {
              process.exit(1);
            }
          '

          cd "$ISOLATED_NPM_DIRECTORY"
          set +e
          EXACT_OUTPUT="$(npm view "$PACKAGE_SPEC" version --json --userconfig="$USER_CONFIG" --globalconfig="$GLOBAL_CONFIG" --registry=https://registry.npmjs.org/ 2>/dev/null)"
          EXACT_STATUS=$?
          set -e
          printf '%s' "$EXACT_OUTPUT" > exact-version.json
          node --input-type=module --eval '
            import fs from "node:fs";
            const status = Number(process.argv[1]);
            let parsed;
            try {
              parsed = JSON.parse(fs.readFileSync("exact-version.json", "utf8"));
            } catch {
              process.exit(1);
            }
            const absent =
              status !== 0 &&
              parsed !== null &&
              typeof parsed === "object" &&
              parsed.error?.code === "E404";
            if (!absent) process.exit(1);
          ' "$EXACT_STATUS"

          # The same rule as scripts/release-preflight.mjs: newer than `latest` and every
          # published stable version, with a pre-release `latest` (the placeholder before
          # the first stable release) accepted only while no stable version is published.
          npm view "$PACKAGE_NAME" versions dist-tags.latest --json --userconfig="$USER_CONFIG" --globalconfig="$GLOBAL_CONFIG" --registry=https://registry.npmjs.org/ > registry-state.json
          EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module --eval '
            import fs from "node:fs";
            const parsed = JSON.parse(fs.readFileSync("registry-state.json", "utf8"));
            const value = Array.isArray(parsed) && parsed.length === 1 ? parsed[0] : parsed;
            const versions = value?.versions;
            const latest = value?.["dist-tags.latest"];
            const stablePattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
            const parse = (version) => {
              const match = pattern.exec(version);
              return match === null ? null : { core: [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])], prerelease: match[4] !== undefined };
            };
            const newer = (candidate, other) => {
              for (let index = 0; index < 3; index += 1) {
                if (candidate.core[index] > other.core[index]) return true;
                if (candidate.core[index] < other.core[index]) return false;
              }
              return other.prerelease;
            };
            const candidate = stablePattern.test(process.env.EXPECTED_VERSION) ? parse(process.env.EXPECTED_VERSION) : null;
            const latestParsed = typeof latest === "string" ? parse(latest) : null;
            const validVersions = Array.isArray(versions) && versions.every((version) => typeof version === "string");
            const stable = validVersions ? versions.filter((version) => stablePattern.test(version)) : [];
            const valid =
              candidate !== null &&
              latestParsed !== null &&
              validVersions &&
              versions.includes(latest) &&
              !versions.includes(process.env.EXPECTED_VERSION) &&
              (latestParsed.prerelease ? stable.length === 0 : stable.length > 0) &&
              stable.every((version) => newer(candidate, parse(version))) &&
              newer(candidate, latestParsed);
            if (!valid) process.exit(1);
          '

          npm publish "$GITHUB_WORKSPACE" \
            --provenance \
            --registry=https://registry.npmjs.org/ \
            --access=public \
            --ignore-scripts \
            --userconfig="$USER_CONFIG" \
            --globalconfig="$GLOBAL_CONFIG"

          VERIFIED=false
          # npm can accept the upload while processing keeps metadata unavailable for
          # several minutes. Bound both polling and each lookup without ever repeating the
          # publish.
          METADATA_DEADLINE=$((SECONDS + 300))
          while (( SECONDS < METADATA_DEADLINE )); do
            METADATA_REMAINING=$((METADATA_DEADLINE - SECONDS))
            if (( METADATA_REMAINING <= 0 )); then break; fi
            if METADATA="$(timeout --signal=KILL "${METADATA_REMAINING}s" npm view "$PACKAGE_SPEC" version gitHead dist-tags.latest dist.attestations --json --prefer-online --fetch-retries=0 --fetch-timeout=10000 --userconfig="$USER_CONFIG" --globalconfig="$GLOBAL_CONFIG" --registry=https://registry.npmjs.org/ 2>/dev/null)" &&
              printf '%s' "$METADATA" |
                EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA="$GITHUB_SHA" node --input-type=module --eval '
                  import fs from "node:fs";
                  const parsed = JSON.parse(fs.readFileSync(0, "utf8"));
                  const value = Array.isArray(parsed) && parsed.length === 1 ? parsed[0] : parsed;
                  const attestations = value?.["dist.attestations"];
                  const valid =
                    value !== null &&
                    typeof value === "object" &&
                    value.version === process.env.EXPECTED_VERSION &&
                    value.gitHead === process.env.EXPECTED_SHA &&
                    value["dist-tags.latest"] === process.env.EXPECTED_VERSION &&
                    attestations?.provenance?.predicateType === "https://slsa.dev/provenance/v1";
                  if (!valid) process.exit(1);
                '
            then
              VERIFIED=true
              break
            fi
            METADATA_REMAINING=$((METADATA_DEADLINE - SECONDS))
            if (( METADATA_REMAINING > 0 )); then
              METADATA_DELAY=10
              if (( METADATA_REMAINING < METADATA_DELAY )); then
                METADATA_DELAY=$METADATA_REMAINING
              fi
              echo "npm accepted the publication; waiting for verified registry metadata (${METADATA_REMAINING}s remaining)." >&2
              sleep "$METADATA_DELAY"
            fi
          done
          if [[ "$VERIFIED" != 'true' ]]; then
            echo 'npm accepted the publication, but metadata did not converge within 300 seconds. Wait for registry processing, then rerun the entire workflow, including verify; do not publish again.' >&2
            exit 1
          fi
          DIFF_VERIFIED=false
          for ATTEMPT in {1..10}; do
            if DIFF_OUTPUT="$(npm diff --diff="$GITHUB_WORKSPACE" --diff="$PACKAGE_SPEC" --diff-name-only --ignore-scripts --prefer-online --cache="$ISOLATED_NPM_DIRECTORY/npm-diff-cache-$ATTEMPT" --userconfig="$USER_CONFIG" --globalconfig="$GLOBAL_CONFIG" --registry=https://registry.npmjs.org/ 2>/dev/null)"; then
              if [[ -n "${DIFF_OUTPUT//[[:space:]]/}" ]]; then
                echo 'Published npm package content differs from the verified release.' >&2
                exit 1
              fi
              DIFF_VERIFIED=true
              break
            fi
            if [[ "$ATTEMPT" -lt 10 ]]; then
              echo "Published npm package content is not retrievable yet (attempt $ATTEMPT/10); retrying." >&2
              sleep 3
            fi
          done
          if [[ "$DIFF_VERIFIED" != 'true' ]]; then
            echo 'Published npm package content did not become retrievable for verification.' >&2
            exit 1
          fi
