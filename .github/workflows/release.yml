name: Release

# Publishes an exact, already-tested tag to npm through trusted publishing (GitHub OIDC,
# no stored token), with the provenance attestation npm generates for it. See
# docs/release.md for the one-time npm and GitHub setup and the release checklist.
#
# Each job holds only what it needs. Installing dependencies, building and running the
# published package happen in jobs with read access alone; the publish job, which alone
# can mint an npm token, installs nothing and runs no package code; only the last job can
# write the GitHub release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run every check
        run: npm run check

  build:
    name: build the release files
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
      version: ${{ steps.pack.outputs.version }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Write the release notes, refusing a tag that does not match the version
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Pack the release tarball
        id: pack
        run: |
          npm pack --json > pack.json
          node -e "const [r]=Object.values(JSON.parse(require('fs').readFileSync('pack.json','utf8'))).flat(); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tarball='+r.filename+'\nintegrity='+r.integrity+'\nversion='+r.version+'\n')"

      - name: Write the dependency inventory (CycloneDX SBOM) of a clean production install
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/release-sbom.mjs "./$TARBALL" testrail-mcp-sbom.cdx.json

      - name: Keep the release files for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.tarball }}
            release-notes.md
            testrail-mcp-sbom.cdx.json
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A protected environment: its required reviewers approve each release, and npm's
    # trusted publisher configuration names it.
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require an npm that supports trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1'); process.exit(1); }" "$(npm --version)"

      # A re-run after a later job failed finds this exact tarball already published and
      # goes on; a different tarball under the same version stops the release.
      - name: Publish the packed tarball, with provenance, once
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          served="$(npm view "@dichovsky/testrail-mcp@$VERSION" dist.integrity 2>/dev/null || true)"
          if [ -n "$served" ]; then
            if [ "$served" = "$INTEGRITY" ]; then echo "$VERSION is already published from this tarball."; exit 0; fi
            echo "::error::$VERSION is already published from a different tarball."; exit 1
          fi
          npm publish "./$TARBALL" --access public --provenance --ignore-scripts

  verify-published:
    name: verify the published package
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the published package from the registry
        env:
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          node scripts/verify-published.mjs "@dichovsky/testrail-mcp@$VERSION"
          --version "$VERSION" --integrity "$INTEGRITY" --require-provenance

  release:
    name: create the GitHub release
    needs: [build, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Create the GitHub release, or complete it on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "./$TARBALL" testrail-mcp-sbom.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md "./$TARBALL" testrail-mcp-sbom.cdx.json
          fi
