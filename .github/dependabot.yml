version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      mcp-sdk:
        patterns:
          - '@modelcontextprotocol/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
